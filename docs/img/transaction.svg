<svg xmlns="http://www.w3.org/2000/svg" width="720" height="481" viewBox="0 0 720 481" role="img" aria-labelledby="title">
<title id="title">Three steps inside the PostgreSQL transaction boundary</title>
<rect width="720" height="481" rx="8" fill="#F4F1E9"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#182B2B}.mono{font-family:monospace;letter-spacing:1.5px}.muted{fill:#526460}.serif{font-family:Georgia,'Times New Roman',serif}</style>
<text x="30" y="43" font-size="16" class="mono muted" >TRANSFER ATOMICITY</text><text x="30" y="88" font-size="32" class="serif" >One transaction. One outcome.</text><rect x="30" y="116" width="660" height="86" rx="8" fill="#FFFFFF" stroke="#CCD3CA"/><text x="49" y="151" font-size="20" class="mono muted" >01</text><text x="100" y="152" font-size="24" class="" >Serialize retry key</text><text x="100" y="182" font-size="19" class="muted" >Replay existing result or reject a conflict.</text><rect x="30" y="218" width="660" height="86" rx="8" fill="#FFFFFF" stroke="#CCD3CA"/><text x="49" y="253" font-size="20" class="mono muted" >02</text><text x="100" y="254" font-size="24" class="" >Lock accounts in UUID order</text><text x="100" y="284" font-size="19" class="muted" >Check available funds after acquiring locks.</text><rect x="30" y="320" width="660" height="86" rx="8" fill="#FFFFFF" stroke="#CCD3CA"/><text x="49" y="355" font-size="20" class="mono muted" >03</text><text x="100" y="356" font-size="24" class="" >Debit + credit + transfer record</text><text x="100" y="386" font-size="19" class="muted" >Commit together; roll back on failure.</text><text x="30" y="451" font-size="19" class="mono muted" >PostgreSQL READ COMMITTED + explicit locks</text>
</svg>
