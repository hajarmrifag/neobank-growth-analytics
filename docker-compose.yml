services:
  postgres:
    image: postgres:16
    container_name: neobank_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - neobank_postgres_data:/var/lib/postgresql/data

volumes:
  neobank_postgres_data:
