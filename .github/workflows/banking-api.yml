name: Banking API tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: banking_test
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U banking_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BANKING_TEST_ADMIN_URL: postgresql://banking_test:${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-api*.txt
      - run: pip install -r requirements-api-dev.txt
      - run: python -m pytest tests/api -q
      - name: Build public demo image
        run: docker build -f Dockerfile.demo -t neobank-public-demo .
      - name: Verify deployed container over HTTP
        run: |
          docker run -d --name public-demo -p 127.0.0.1:18000:10000 neobank-public-demo
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/health; then break; fi
            sleep 1
          done
          docker exec -e BANKING_API_URL=http://127.0.0.1:10000 public-demo python -m banking_api.demo
      - name: Container logs
        if: failure()
        run: docker logs public-demo
